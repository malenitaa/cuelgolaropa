name: Audit

# Vulnerabilidades conocidas en lo que llega a producción, todos los días y en
# cada push a main, no solo en PRs: si sale un CVE de next o react, la corrida
# del día se pone en rojo y GitHub avisa por mail.
on:
  schedule:
    - cron: "17 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Lee solo el lockfile: no instala nada ni corre scripts.
      - run: npm audit --package-lock-only --omit=dev --audit-level=high
